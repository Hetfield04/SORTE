<script>
'use strict';
/* ============================================================
   SORTE: Uma questão de tempo — demo jogável (HTML5 Canvas)
   ============================================================ */
const W = 384, H = 216, T = 16, G = 900, JUMP = 330;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
function fit() {
  const s = Math.max(1, Math.min(innerWidth / W, innerHeight / H));
  const si = s >= 2 ? Math.floor(s) : s;
  cv.style.width = W * si + 'px'; cv.style.height = H * si + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- Entrada ---------- */
const down = {}, pressed = {};
const MAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump', KeyW: 'jump', Space: 'jump',
  ArrowDown: 'down', KeyS: 'down',
  ShiftLeft: 'run', ShiftRight: 'run',
  KeyE: 'act', Enter: 'act', KeyJ: 'act',
  KeyR: 'reset', KeyM: 'mute'
};
addEventListener('keydown', e => {
  const k = MAP[e.code]; if (!k) return;
  e.preventDefault();
  if (!down[k]) pressed[k] = true;
  down[k] = true; initAudio();
});
addEventListener('keyup', e => { const k = MAP[e.code]; if (k) { e.preventDefault(); down[k] = false; } });
addEventListener('blur', () => { for (const k in down) down[k] = false; });

/* ---------- Áudio (chiptune simples) ---------- */
let AC = null, muted = false;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); startMusic(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'square', v = 0.04, f2 = null, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
const sfx = {
  jump: () => tone(300, .12, 'square', .035, 620),
  coin: () => { tone(880, .06); tone(1320, .12, 'square', .035, null, .06); },
  hit: () => tone(140, .35, 'sawtooth', .06, 40),
  stomp: () => tone(220, .1, 'square', .05, 90),
  blip: () => tone(540 + Math.random() * 60, .03, 'square', .015),
  warp: () => { for (let i = 0; i < 8; i++) tone(180 + i * 90, .18, 'triangle', .05, 90 + i * 40, i * .07); },
  tick: () => tone(1000, .05, 'square', .03)
};
let musicStep = 0, musicTheme = 'title';
const THEMES = {
  title: { bpm: 300, lead: [57, 60, 64, 60, 57, 60, 64, 67], bass: [45, 0, 0, 0, 41, 0, 0, 0], vol: .018 },
  mata: { bpm: 250, lead: [57, 0, 60, 0, 64, 0, 60, 0, 55, 0, 59, 0, 62, 0, 59, 0], bass: [45, 0, 45, 0, 43, 0, 43, 0], vol: .016 },
  loop: { bpm: 420, lead: [64, 67, 71, 67, 64, 67, 72, 67], bass: [40, 40, 0, 40, 43, 43, 0, 43], vol: .02 },
  pizza: { bpm: 280, lead: [60, 64, 67, 64, 62, 65, 69, 65], bass: [48, 0, 48, 0, 50, 0, 50, 0], vol: .016 },
  past: { bpm: 330, lead: [62, 0, 65, 69, 67, 0, 65, 62, 60, 0, 64, 67, 65, 0, 62, 60], bass: [38, 0, 45, 0, 36, 0, 43, 0], vol: .02 }
};
const mf = n => 440 * Math.pow(2, (n - 69) / 12);
function startMusic() {
  (function loop() {
    const th = THEMES[musicTheme];
    if (th && AC && !muted) {
      const l = th.lead[musicStep % th.lead.length], b = th.bass[musicStep % th.bass.length];
      if (l) tone(mf(l), .16, 'square', th.vol);
      if (b) tone(mf(b), .22, 'triangle', th.vol * 1.6);
    }
    musicStep++;
    setTimeout(loop, 60000 / (th ? th.bpm : 300));
  })();
}

/* ---------- Utilitários de desenho ---------- */
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), w, h); }
/* Fonte bitmap 5x7 (maiúsculas, com acentos compostos). Cada glifo: 7 linhas de 5 colunas. */
const FONT = {};
(function () {
  const d = {
    A: '01110/10001/10001/11111/10001/10001/10001', B: '11110/10001/10001/11110/10001/10001/11110',
    C: '01110/10001/10000/10000/10000/10001/01110', D: '11110/10001/10001/10001/10001/10001/11110',
    E: '11111/10000/10000/11110/10000/10000/11111', F: '11111/10000/10000/11110/10000/10000/10000',
    G: '01110/10001/10000/10111/10001/10001/01111', H: '10001/10001/10001/11111/10001/10001/10001',
    I: '01110/00100/00100/00100/00100/00100/01110', J: '00111/00010/00010/00010/00010/10010/01100',
    K: '10001/10010/10100/11000/10100/10010/10001', L: '10000/10000/10000/10000/10000/10000/11111',
    M: '10001/11011/10101/10101/10001/10001/10001', N: '10001/11001/10101/10011/10001/10001/10001',
    O: '01110/10001/10001/10001/10001/10001/01110', P: '11110/10001/10001/11110/10000/10000/10000',
    Q: '01110/10001/10001/10001/10101/10010/01101', R: '11110/10001/10001/11110/10100/10010/10001',
    S: '01111/10000/10000/01110/00001/00001/11110', T: '11111/00100/00100/00100/00100/00100/00100',
    U: '10001/10001/10001/10001/10001/10001/01110', V: '10001/10001/10001/10001/10001/01010/00100',
    W: '10001/10001/10001/10101/10101/11011/10001', X: '10001/10001/01010/00100/01010/10001/10001',
    Y: '10001/10001/01010/00100/00100/00100/00100', Z: '11111/00001/00010/00100/01000/10000/11111',
    0: '01110/10001/10011/10101/11001/10001/01110', 1: '00100/01100/00100/00100/00100/00100/01110',
    2: '01110/10001/00001/00010/00100/01000/11111', 3: '11110/00001/00001/01110/00001/00001/11110',
    4: '00010/00110/01010/10010/11111/00010/00010', 5: '11111/10000/11110/00001/00001/10001/01110',
    6: '00110/01000/10000/11110/10001/10001/01110', 7: '11111/00001/00010/00100/01000/01000/01000',
    8: '01110/10001/10001/01110/10001/10001/01110', 9: '01110/10001/10001/01111/00001/00010/01100',
    '.': '00000/00000/00000/00000/00000/01100/01100', ',': '00000/00000/00000/00000/01100/00100/01000',
    ':': '00000/01100/01100/00000/01100/01100/00000', '!': '00100/00100/00100/00100/00100/00000/00100',
    '?': '01110/10001/00001/00010/00100/00000/00100', '-': '00000/00000/00000/11111/00000/00000/00000',
    '—': '00000/00000/00000/11111/00000/00000/00000', "'": '00100/00100/01000/00000/00000/00000/00000',
    '(': '00010/00100/01000/01000/01000/00100/00010', ')': '01000/00100/00010/00010/00010/00100/01000',
    '·': '00000/00000/00000/00100/00000/00000/00000', '~': '00000/01000/10101/00010/00000/00000/00000',
    '/': '00001/00010/00010/00100/01000/01000/10000',
    '▼': '11111/01110/00100/00000/00000/00000/00000', '▲': '00100/01110/11111/00000/00000/00000/00000',
    '◆': '00100/01110/11111/01110/00100/00000/00000', '←': '00000/00100/01000/11111/01000/00100/00000',
    '→': '00000/00100/00010/11111/00010/00100/00000', '↓': '00100/00100/00100/10101/01110/00100/00000'
  };
  for (const k in d) FONT[k] = d[k].split('/');
})();
const ACCENT = { '́': [[3, 1], [2, 2]], '̀': [[1, 1], [2, 2]], '̂': [[2, 1], [1, 2], [3, 2]], '̃': [[1, 2], [2, 1], [3, 1], [4, 2]], '̈': [[1, 1], [3, 1]], '̧': [[2, 10], [1, 10]] };
const gcache = new Map();
function glyph(ch, color) {
  const key = ch + color; let c = gcache.get(key); if (c) return c;
  c = document.createElement('canvas'); c.width = 5; c.height = 11;
  const g = c.getContext('2d'); g.fillStyle = color;
  const nf = ch.normalize('NFD'), base = FONT[nf[0]];
  if (base) base.forEach((row, y) => { for (let x = 0; x < 5; x++) if (row[x] === '1') g.fillRect(x, y + 3, 1, 1); });
  for (let i = 1; i < nf.length; i++) (ACCENT[nf[i]] || []).forEach(([x, y]) => g.fillRect(x, y, 1, 1));
  gcache.set(key, c); return c;
}
function txt(s, x, y, c = '#fff', align = 'left', size = 8) {
  const sc = Math.max(1, Math.round(size / 8)); s = String(s).toUpperCase();
  const w = s.length * 6 * sc - sc;
  x = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x); y = Math.round(y);
  for (const pass of [0, 1]) {
    const col = pass ? c : '#000', o = pass ? 0 : sc;
    for (let i = 0; i < s.length; i++) if (s[i] !== ' ') ctx.drawImage(glyph(s[i], col), x + i * 6 * sc + o, y - 3 * sc + o, 5 * sc, 11 * sc);
  }
}
const hs = (a, b) => (((a * 73856093) ^ (b * 19349663)) >>> 0);
function hex(c) { return [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; }
function sky(c1, c2, c3, h = H) {
  for (let i = 0; i < 14; i++) { const t = i / 13; R(0, i * h / 14, W, h / 14 + 1, t < .5 ? mix(c1, c2, t * 2) : mix(c2, c3, (t - .5) * 2)); }
}
function cols(cam, par, step, baseY, hf, col) {
  const i0 = Math.floor(cam * par / step);
  for (let i = i0 - 1; i < i0 + W / step + 2; i++) { const wx = i * step, h = hf(wx); R(wx - cam * par, baseY - h, step, h, col); }
}
function wrap(text, maxW) {
  const words = text.split(' '), out = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (t.length * 6 > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur); return out;
}

/* ---------- Personagens ---------- */
const JOAO = { cap: '#c0392b', body: '#f1c40f', stripe: '#b8860b', legs: '#2b3a8a', bag: '#d35400' };
const CHEF = { cap: '#ecf0f1', hat: 1, body: '#ecf0f1', stripe: '#bdc3c7', legs: '#444' };
const ATEN = { cap: '#27ae60', body: '#2ecc71', stripe: '#1e8449', legs: '#555' };
function person(x, y, f, st, t, c) {
  const r = (dx, dy, w, h, col) => R(f > 0 ? x - 1 + dx : x - 1 + 10 - dx - w, y + dy, w, h, col);
  const walk = st === 'walk' || st === 'run', fr = Math.floor(t * (st === 'run' ? 14 : 9)) % 2;
  if (c.bag) { r(-2, 7, 3, 6, c.bag); r(-2, 7, 3, 1, '#f39c12'); }
  const lg = walk ? (fr ? [3, 2] : [2, 3]) : (st === 'air' ? [3, 2] : [3, 3]);
  r(2, 12, 3, lg[0], c.legs); r(5, 12, 3, lg[1], c.legs);
  r(2, 11 + lg[0], 3, 1, '#111'); r(5, 11 + lg[1], 3, 1, '#111');
  r(1, 7, 8, 5, c.body); r(1, 10, 8, 1, c.stripe || c.body);
  if (st === 'air') r(6, 5, 3, 3, c.body); else r(6, 8, 3, 3, c.body);
  r(2, 2, 6, 5, '#e0a070'); r(6, 3, 1, 2, '#111');
  r(2, 0, 6, 2, c.cap); r(7, 1, 3, 1, c.cap);
  if (c.hat) r(2, -4, 6, 4, '#fff');
}
function drawMotoBody(x, gy, wob = 0) {
  for (const wx of [x, x + 24]) { R(wx + 1, gy - 10 + wob, 8, 10, '#111'); R(wx, gy - 9 + wob, 10, 8, '#111'); R(wx + 3, gy - 7 + wob, 4, 4, '#999'); }
  R(x + 4, gy - 15 + wob, 20, 5, '#c0392b'); R(x + 5, gy - 17 + wob, 11, 2, '#222');
  R(x + 22, gy - 19 + wob, 5, 2, '#bbb'); R(x + 25, gy - 17 + wob, 2, 9, '#bbb'); R(x + 14, gy - 22 + wob, 9, 6, '#d35400');
}
function drawRiderOnMoto(x, gy, duck) {
  if (!duck) {
    R(x + 2, gy - 32, 9, 12, '#d35400'); R(x + 2, gy - 32, 9, 2, '#f39c12');
    R(x + 8, gy - 30, 9, 11, '#f1c40f'); R(x + 10, gy - 20, 8, 4, '#2b3a8a'); R(x + 14, gy - 26, 8, 3, '#f1c40f');
    R(x + 10, gy - 38, 7, 7, '#e0a070'); R(x + 10, gy - 39, 7, 3, '#c0392b'); R(x + 16, gy - 36, 1, 2, '#111');
  } else {
    R(x + 3, gy - 28, 9, 10, '#d35400'); R(x + 9, gy - 24, 11, 7, '#f1c40f'); R(x + 10, gy - 18, 8, 4, '#2b3a8a');
    R(x + 18, gy - 22, 5, 3, '#f1c40f'); R(x + 17, gy - 29, 7, 7, '#e0a070'); R(x + 17, gy - 30, 7, 3, '#c0392b'); R(x + 23, gy - 27, 1, 2, '#111');
  }
}

/* ---------- Níveis em tiles ---------- */
function level(w, h) { const g = []; for (let y = 0; y < h; y++) g.push(new Array(w).fill(' ')); return { w, h, g }; }
function fill(L, x, y, w, h, c = '#') { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (j >= 0 && j < L.h && i >= 0 && i < L.w) L.g[j][i] = c; }
function tile(L, tx, ty) { if (tx < 0 || tx >= L.w) return '#'; if (ty < 0 || ty >= L.h) return ' '; return L.g[ty][tx]; }
function moveBody(b, L, dt) {
  b.x += b.vx * dt;
  let top = Math.floor(b.y / T), bot = Math.floor((b.y + b.h - .01) / T);
  if (b.vx > 0) { const tx = Math.floor((b.x + b.w - .01) / T); for (let ty = top; ty <= bot; ty++) if (tile(L, tx, ty) === '#') { b.x = tx * T - b.w; b.vx = 0; break; } }
  else if (b.vx < 0) { const tx = Math.floor(b.x / T); for (let ty = top; ty <= bot; ty++) if (tile(L, tx, ty) === '#') { b.x = (tx + 1) * T; b.vx = 0; break; } }
  const py = b.y; b.y += b.vy * dt; b.ground = false;
  const l = Math.floor(b.x / T), r = Math.floor((b.x + b.w - .01) / T);
  if (b.vy >= 0) {
    const ty = Math.floor((b.y + b.h) / T), pb = py + b.h;
    for (let tx = l; tx <= r; tx++) { const t = tile(L, tx, ty); if (t === '#' || (t === '-' && pb <= ty * T + .01)) { b.y = ty * T - b.h; b.vy = 0; b.ground = true; break; } }
  } else {
    const ty = Math.floor(b.y / T);
    for (let tx = l; tx <= r; tx++) if (tile(L, tx, ty) === '#') { b.y = (ty + 1) * T; b.vy = 0; break; }
  }
}

/* ---------- Estado global ---------- */
const S = { coins: 0, loops: 0, sawTV: false, bet: false, tries: 0 };
let scene = null, mode = 'title', dlg = null, warp = null, shake = 0, flash = 0, time = 0, P = null, cam = 0;
const GROUND = 11 * T;           // topo do chão (px) em fases de 13 linhas
const OY = H - 13 * T;           // deslocamento vertical do mundo

const PAL = {
  mata: { sky: ['#140c2e', '#3a2062', '#c2547a'], solid: '#4a3426', solid2: '#3a2819', top: '#3d7a3a', top2: '#2d5e2c', plat: '#7a5230', platL: '#a37446' },
  pizza: { solid: '#3a2a22', solid2: '#2b1e18', top: '#a8794a', top2: '#7a5530', plat: '#7a5230', platL: '#a37446' },
  past: { sky: ['#d9a066', '#eec39a', '#f6e6c4'], solid: '#7a6450', solid2: '#625040', top: '#b59a74', top2: '#9a8060', plat: '#8a6b45', platL: '#b08d5c' }
};

/* ---------- Diálogos e transição ---------- */
function say(lines, cb) { dlg = { lines, i: 0, n: 0, cb }; }
function updateDlg(dt) {
  const full = dlg.lines[dlg.i][1];
  const before = Math.floor(dlg.n);
  dlg.n += dt * 55;
  if (Math.floor(dlg.n) !== before && Math.floor(dlg.n) % 3 === 0 && dlg.n < full.length) sfx.blip();
  if (pressed.act || pressed.jump) {
    if (dlg.n < full.length) dlg.n = full.length;
    else { dlg.i++; dlg.n = 0; if (dlg.i >= dlg.lines.length) { const cb = dlg.cb; dlg = null; if (cb) cb(); } }
  }
}
function drawDlg() {
  if (!dlg) return;
  const [who, text] = dlg.lines[dlg.i];
  const bx = 10, by = H - 64, bw = W - 20, bh = 54;
  R(bx - 2, by - 2, bw + 4, bh + 4, '#f1c40f'); R(bx, by, bw, bh, '#0a0618');
  const col = who === 'João' ? '#f1c40f' : who === 'Narrador' ? '#9fb3ff' : '#7fe0a0';
  txt(who, bx + 8, by + 6, col);
  const lines = wrap(text, bw - 24); let rem = Math.floor(dlg.n);
  lines.forEach((ln, i) => { if (rem > 0) txt(ln.slice(0, rem), bx + 8, by + 20 + i * 10); rem -= ln.length + 1; });
  if (dlg.n >= text.length && Math.floor(time * 3) % 2 === 0) txt('▼', bx + bw - 14, by + bh - 12, '#f1c40f');
}
function goto(fn) { warp = { t: 0, fn, did: false }; sfx.warp(); }
function drawWarp() {
  if (!warp) return;
  const a = warp.t < .7 ? warp.t / .7 : 1 - (warp.t - .7) / .7;
  ctx.globalAlpha = Math.max(0, Math.min(1, a)) * .92; R(0, 0, W, H, '#e9dcff');
  ctx.globalAlpha = Math.max(0, Math.min(1, a));
  for (let i = 0; i < 14; i++) R(Math.random() * W - 40, Math.random() * H, 60 + Math.random() * 160, 2 + Math.random() * 6, Math.random() < .5 ? '#7a3cff' : '#38d6ff');
  ctx.globalAlpha = 1;
  if (warp.t > .25 && warp.t < 1.2) txt('~ A LINHA DO TEMPO SE RECALCULA ~', W / 2, H / 2 - 4, '#2a0a66', 'center');
}

/* ---------- Cenário: a mata (presente, após o acidente) ---------- */
function makeMata() {
  const L = level(72, 13);
  fill(L, 0, 11, 72, 2);
  fill(L, 22, 11, 3, 2, ' '); fill(L, 40, 11, 4, 2, ' '); fill(L, 56, 11, 3, 2, ' ');
  fill(L, 28, 8, 5, 1, '-'); fill(L, 34, 6, 3, 1, '-');
  fill(L, 48, 10, 2, 1); fill(L, 50, 9, 2, 2); fill(L, 52, 10, 2, 1);
  const coins = [[29, 7], [30, 7], [31, 7], [35, 5], [36, 5], [12, 10], [14, 10], [42, 9], [43, 9], [57, 9]].map(([x, y]) => ({ x: x * T + 8, y: y * T + 8, got: false }));
  return {
    kind: 'plat', name: 'mata', L, pal: PAL.mata, spawn: [5 * T, GROUND - 15], coins, enemies: [], age: 0, timed: 0,
    label: '2026 · A MATA', music: 'mata',
    ints: [{ x: 66 * T - 6, y: GROUND - 34, w: 30, h: 34, act: () => say([['João', 'Essa luz... está saindo do banheiro químico?!'], ['João', 'O que é isso?! Estou sendo puxado!']], () => goto(startMoto)) }],
    bg(cam) {
      sky(...this.pal.sky);
      for (let i = 0; i < 34; i++) { const tw = (Math.floor(time * 2 + i) % 5) ? '#fff' : '#889'; R(hs(i, 1) % W, hs(i, 2) % 100, 1, 1, tw); }
      R(300, 22, 14, 14, '#f4ecc8'); R(304, 24, 3, 3, '#e0d6a8');
      cols(cam, .2, 8, 190, wx => 40 + 16 * Math.sin(wx * .02) + 8 * Math.sin(wx * .055), '#271a4a');
      const i0 = Math.floor(cam * .5 / 40);
      for (let i = i0 - 1; i < i0 + 12; i++) { const x = Math.round(i * 40 + hs(i, 3) % 16 - cam * .5); R(x + 6, 172, 4, 14, '#1a0f14'); R(x, 160, 16, 8, '#1b3a2c'); R(x + 2, 152, 12, 8, '#1b3a2c'); R(x + 4, 146, 8, 6, '#214a36'); }
    },
    decor() {
      // moto destruída
      R(2 * T, GROUND - 8, 10, 8, '#111'); R(2 * T + 22, GROUND - 6, 8, 6, '#111'); R(2 * T + 6, GROUND - 12, 20, 5, '#7a1f16'); R(2 * T + 24, GROUND - 16, 3, 3, '#777');
      txt('(sua moto)', 2 * T - 2, GROUND - 24, '#bbb');
      // banheiro químico + fenda

  if (scene.name === 'mata' && scene.age < 12 && !dlg) txt('←→ mover · SHIFT correr · ESPAÇO pular · E interagir', W / 2, H - 14, '#fff', 'center');
  if (scene.name === 'loteria') {
    ctx.globalAlpha = .07; for (let i = 0; i < 60; i++) R(Math.random() * W, Math.random() * H, 2, 1, '#000'); ctx.globalAlpha = 1;
    for (let y = 0; y < H; y += 3) { ctx.globalAlpha = .05; R(0, y, W, 1, '#000'); } ctx.globalAlpha = 1;
  }
}

/* ---------- Título e fim ---------- */
function drawTitle() {
  sky('#0b0620', '#2a1559', '#a84a7a');
  for (let i = 0; i < 40; i++) R(hs(i, 1) % W, hs(i, 2) % 150, 1, 1, Math.floor(time * 2 + i) % 4 ? '#fff' : '#667');
  const cs = ['#e74c3c', '#f1c40f', '#3498db', '#2ecc71', '#9b59b6', '#e67e22'], ns = ['04', '17', '23', '38', '41', '56'];
  for (let i = 0; i < 6; i++) { const x = 30 + i * 58, y = 150 + Math.sin(time * 1.5 + i) * 6; R(x, y, 18, 18, cs[i]); R(x + 2, y - 2, 14, 22, cs[i]); R(x - 2, y + 2, 22, 14, cs[i]); txt(ns[i], x + 9, y + 5, '#fff', 'center'); }
  txt('SORTE', W / 2, 38, '#ffe45e', 'center', 40);
  txt('Uma questão de tempo', W / 2, 88, '#fff', 'center', 12);
  txt('DEMO JOGÁVEL', W / 2, 108, '#7fe9ff', 'center', 8);
  if (Math.floor(time * 2) % 2) txt('Pressione ENTER ou ESPAÇO', W / 2, 126, '#fff', 'center');
  txt('← → mover · SHIFT correr · ESPAÇO pular · ↓ abaixar', W / 2, H - 24, '#aab', 'center');
  txt('E interagir · M som', W / 2, H - 13, '#aab', 'center');
}
function endDemo() { mode = 'end'; musicTheme = 'title'; }
function drawEnd() {
  sky('#0b0620', '#2a1559', '#7a3a9a');
  txt('FIM DA DEMO', W / 2, 24, '#ffe45e', 'center', 22);
  txt('Os números mudaram. A linha do tempo também.', W / 2, 62, '#fff', 'center');
  const ls = ['Moedas na mochila: ' + S.coins, 'Loops no acidente: ' + S.loops, 'Tentativas na lotérica: ' + S.tries, '', 'Em breve: o sidekick e suas memórias,', 'ecos temporais, a política e os outros cenários.'];
  ls.forEach((l, i) => txt(l, W / 2, 86 + i * 12, i > 3 ? '#9fb3ff' : '#fff', 'center'));
  if (Math.floor(time * 2) % 2) txt('ENTER para jogar de novo', W / 2, H - 22, '#fff', 'center');
}

/* ---------- Laço principal ---------- */
function startGame() {
  S.coins = 0; S.loops = 0; S.sawTV = false; S.bet = false; S.tries = 0;
  scene = makeMata(); resetPlayer(); mode = 'play';
  say([['Narrador', 'Uma ladeira, uma moto fora da pista... e uma luz estranha no meio da mata.'], ['João', 'Ai... minha cabeça. Estou inteiro, mas a moto... De onde vem aquela luz?']]);
}
function step(dt) {
  time += dt; shake = Math.max(0, shake - dt * 30); flash = Math.max(0, flash - dt);
  if (pressed.mute) { muted = !muted; }
  if (mode === 'title') { musicTheme = 'title'; if (pressed.act || pressed.jump) startGame(); return; }
  if (mode === 'end') { if (pressed.act || pressed.jump || pressed.reset) { mode = 'title'; scene = null; } return; }
  if (warp) { warp.t += dt; if (warp.t > .7 && !warp.did) { warp.did = true; warp.fn(); } if (warp.t > 1.4) warp = null; return; }
  if (dlg) { updateDlg(dt); return; }
  if (scene.kind === 'moto') updateMoto(dt); else updatePlat(dt);
}
function render() {
  ctx.save();
  if (shake > 0) ctx.translate(Math.round((Math.random() - .5) * shake), Math.round((Math.random() - .5) * shake));
  R(-10, -10, W + 20, H + 20, '#000');
  if (mode === 'title') drawTitle();
  else if (mode === 'end') drawEnd();
  else if (scene) {
    if (scene.kind === 'moto') { drawMoto(); txt('LOOP ' + S.loops, 6, 5, '#ffe45e'); txt(scene.label.split(' ·')[0], W - 6, 5, '#fff', 'right'); }
    else drawPlat();
  }
  ctx.restore();
  if (flash > 0) { ctx.globalAlpha = Math.min(1, flash); R(0, 0, W, H, '#fff'); ctx.globalAlpha = 1; }
  drawDlg(); drawWarp();
  if (muted) txt('(mudo)', W - 6, H - 12, '#aaa', 'right');
}
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(.1, (now - last) / 1000); last = now;
  while (acc >= 1 / 60) { step(1 / 60); acc -= 1 / 60; for (const k in pressed) pressed[k] = false; }
  render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
cv.focus();
// Gancho de teste/depuração
window.__sorte = { S, get scene() { return scene; }, get P() { return P; }, startGame, step, get mode() { return mode; } };
</script>
