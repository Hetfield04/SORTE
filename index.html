<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SORTE — Demo</title>
<style>
html,body{margin:0;height:100%;background:#05030a;display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{background:#000;outline:none}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<script>
'use strict';
/* ============================================================
   SORTE: Uma questão de tempo — demo jogável (HTML5 Canvas)
   Pipeline: mundo em 384x216 (pixel art) -> pós-processamento em
   alta resolução (luzes, bloom, névoa, vinheta, grão) -> UI nítida.
   ============================================================ */
const W = 384, H = 216, T = 16, G = 900, JUMP = 330;
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const cv = document.getElementById('c'), dctx = cv.getContext('2d');
const SC = 2;   // densidade de pixels: cada unidade lógica = SC x SC pixels do dispositivo
const gc = mkCanvas(W * SC, H * SC), uc = mkCanvas(W * SC, H * SC), bgc = mkCanvas(W * SC, H * SC), fgc = mkCanvas(W * SC, H * SC), mc = mkCanvas(W * SC, H * SC);
const gctx = gc.getContext('2d'), uctx = uc.getContext('2d'), bgx = bgc.getContext('2d'), fgx = fgc.getContext('2d'), mcx = mc.getContext('2d');
for (const c of [gctx, uctx, bgx, fgx, mcx]) c.imageSmoothingEnabled = false;
const shk = { x: 0, y: 0 };
let ctx = gctx, DW = W, DH = H;
function fit() {
  const dpr = window.devicePixelRatio || 1;
  let s = Math.min(innerWidth / W, innerHeight / H); if (s >= 2) s = Math.floor(s);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  DW = cv.width = Math.round(W * s * dpr); DH = cv.height = Math.round(H * s * dpr);
}
addEventListener('resize', fit); fit();

/* ---------- Entrada ---------- */
const down = {}, pressed = {};
const MAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', ArrowDown: 'down', KeyS: 'down',
  ShiftLeft: 'run', ShiftRight: 'run', KeyE: 'act', Enter: 'act', KeyJ: 'act', KeyR: 'reset', KeyM: 'mute'
};
addEventListener('keydown', e => { const k = MAP[e.code]; if (!k) return; e.preventDefault(); if (!down[k]) pressed[k] = true; down[k] = true; initAudio(); });
addEventListener('keyup', e => { const k = MAP[e.code]; if (k) { e.preventDefault(); down[k] = false; } });
addEventListener('blur', () => { for (const k in down) down[k] = false; });

/* ---------- Áudio (chiptune simples) ---------- */
let AC = null, muted = false;
function initAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); startMusic(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
}
function tone(f, d, type = 'square', v = 0.04, f2 = null, delay = 0) {
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
}
const sfx = {
  jump: () => tone(300, .12, 'square', .035, 620), coin: () => { tone(880, .06); tone(1320, .12, 'square', .035, null, .06); },
  hit: () => tone(140, .35, 'sawtooth', .06, 40), stomp: () => tone(220, .1, 'square', .05, 90),
  blip: () => tone(540 + Math.random() * 60, .03, 'square', .015),
  warp: () => { for (let i = 0; i < 8; i++) tone(180 + i * 90, .18, 'triangle', .05, 90 + i * 40, i * .07); },
  tick: () => tone(1000, .05, 'square', .03)
};
let musicStep = 0, musicTheme = 'title';
const THEMES = {
  title: { bpm: 300, lead: [57, 60, 64, 60, 57, 60, 64, 67], bass: [45, 0, 0, 0, 41, 0, 0, 0], vol: .018 },
  mata: { bpm: 250, lead: [57, 0, 60, 0, 64, 0, 60, 0, 55, 0, 59, 0, 62, 0, 59, 0], bass: [45, 0, 45, 0, 43, 0, 43, 0], vol: .016 },
  loop: { bpm: 420, lead: [64, 67, 71, 67, 64, 67, 72, 67], bass: [40, 40, 0, 40, 43, 43, 0, 43], vol: .02 },
  pizza: { bpm: 280, lead: [60, 64, 67, 64, 62, 65, 69, 65], bass: [48, 0, 48, 0, 50, 0, 50, 0], vol: .016 },
  past: { bpm: 330, lead: [62, 0, 65, 69, 67, 0, 65, 62, 60, 0, 64, 67, 65, 0, 62, 60], bass: [38, 0, 45, 0, 36, 0, 43, 0], vol: .02 }
};
const mf = n => 440 * Math.pow(2, (n - 69) / 12);
function startMusic() {
  (function loop() {
    const th = THEMES[musicTheme];
    if (th && AC && !muted) { const l = th.lead[musicStep % th.lead.length], b = th.bass[musicStep % th.bass.length]; if (l) tone(mf(l), .16, 'square', th.vol); if (b) tone(mf(b), .22, 'triangle', th.vol * 1.6); }
    musicStep++; setTimeout(loop, 60000 / (th ? th.bpm : 300));
  })();
}

/* ---------- Desenho básico ---------- */
function R(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x * SC) / SC, Math.round(y * SC) / SC, w, h); }
const hs = (a, b) => (((a * 73856093) ^ (b * 19349663)) >>> 0);
function hex(c) { return [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',') + ')'; }
function sky(c1, c2, c3, h = H) { const n = 48; for (let i = 0; i < n; i++) { const t = i / (n - 1); R(0, i * h / n, W, h / n + .5, t < .5 ? mix(c1, c2, t * 2) : mix(c2, c3, (t - .5) * 2)); } }
function cols(cam, par, step, baseY, hf, col) {
  const i0 = Math.floor(cam * par / step);
  for (let i = i0 - 1; i < i0 + W / step + 2; i++) { const wx = i * step, h = hf(wx); R(wx - cam * par, baseY - h, step, h, col); }
}

/* Fonte bitmap 5x7 (maiúsculas, acentos compostos) */
const FONT = {};
(function () {
  const d = {
    A: '01110/10001/10001/11111/10001/10001/10001', B: '11110/10001/10001/11110/10001/10001/11110', C: '01110/10001/10000/10000/10000/10001/01110',
    D: '11110/10001/10001/10001/10001/10001/11110', E: '11111/10000/10000/11110/10000/10000/11111', F: '11111/10000/10000/11110/10000/10000/10000',
    G: '01110/10001/10000/10111/10001/10001/01111', H: '10001/10001/10001/11111/10001/10001/10001', I: '01110/00100/00100/00100/00100/00100/01110',
    J: '00111/00010/00010/00010/00010/10010/01100', K: '10001/10010/10100/11000/10100/10010/10001', L: '10000/10000/10000/10000/10000/10000/11111',
    M: '10001/11011/10101/10101/10001/10001/10001', N: '10001/11001/10101/10011/10001/10001/10001', O: '01110/10001/10001/10001/10001/10001/01110',
    P: '11110/10001/10001/11110/10000/10000/10000', Q: '01110/10001/10001/10001/10101/10010/01101', R: '11110/10001/10001/11110/10100/10010/10001',
    S: '01111/10000/10000/01110/00001/00001/11110', T: '11111/00100/00100/00100/00100/00100/00100', U: '10001/10001/10001/10001/10001/10001/01110',
    V: '10001/10001/10001/10001/10001/01010/00100', W: '10001/10001/10001/10101/10101/11011/10001', X: '10001/10001/01010/00100/01010/10001/10001',
    Y: '10001/10001/01010/00100/00100/00100/00100', Z: '11111/00001/00010/00100/01000/10000/11111',
    0: '01110/10001/10011/10101/11001/10001/01110', 1: '00100/01100/00100/00100/00100/00100/01110', 2: '01110/10001/00001/00010/00100/01000/11111',
    3: '11110/00001/00001/01110/00001/00001/11110', 4: '00010/00110/01010/10010/11111/00010/00010', 5: '11111/10000/11110/00001/00001/10001/01110',
    6: '00110/01000/10000/11110/10001/10001/01110', 7: '11111/00001/00010/00100/01000/01000/01000', 8: '01110/10001/10001/01110/10001/10001/01110',
    9: '01110/10001/10001/01111/00001/00010/01100',
    '.': '00000/00000/00000/00000/00000/01100/01100', ',': '00000/00000/00000/00000/01100/00100/01000', ':': '00000/01100/01100/00000/01100/01100/00000',
    '!': '00100/00100/00100/00100/00100/00000/00100', '?': '01110/10001/00001/00010/00100/00000/00100', '-': '00000/00000/00000/11111/00000/00000/00000',
    '—': '00000/00000/00000/11111/00000/00000/00000', "'": '00100/00100/01000/00000/00000/00000/00000', '(': '00010/00100/01000/01000/01000/00100/00010',
    ')': '01000/00100/00010/00010/00010/00100/01000', '·': '00000/00000/00000/00100/00000/00000/00000', '~': '00000/01000/10101/00010/00000/00000/00000',
    '/': '00001/00010/00010/00100/01000/01000/10000', '▼': '11111/01110/00100/00000/00000/00000/00000', '▲': '00100/01110/11111/00000/00000/00000/00000',
    '◆': '00100/01110/11111/01110/00100/00000/00000', '←': '00000/00100/01000/11111/01000/00100/00000', '→': '00000/00100/00010/11111/00010/00100/00000',
    '↓': '00100/00100/00100/10101/01110/00100/00000'
  };
  for (const k in d) FONT[k] = d[k].split('/');
})();
const ACCENT = { '́': [[3, 1], [2, 2]], '̀': [[1, 1], [2, 2]], '̂': [[2, 1], [1, 2], [3, 2]], '̃': [[1, 2], [2, 1], [3, 1], [4, 2]], '̈': [[1, 1], [3, 1]], '̧': [[2, 10], [1, 10]] };
const gcache = new Map();
function glyph(ch, color) {
  const key = ch + color; let c = gcache.get(key); if (c) return c;
  c = mkCanvas(5, 11); const g = c.getContext('2d'); g.fillStyle = color;
  const nf = ch.normalize('NFD'), base = FONT[nf[0]];
  if (base) base.forEach((row, y) => { for (let x = 0; x < 5; x++) if (row[x] === '1') g.fillRect(x, y + 3, 1, 1); });
  for (let i = 1; i < nf.length; i++) (ACCENT[nf[i]] || []).forEach(([x, y]) => g.fillRect(x, y, 1, 1));
  gcache.set(key, c); return c;
}
function txt(s, x, y, c = '#fff', align = 'left', size = 8) {
  const sc = Math.max(1, Math.round(size / 8)); s = String(s).toUpperCase();
  const w = s.length * 6 * sc - sc;
  x = Math.round(align === 'center' ? x - w / 2 : align === 'right' ? x - w : x); y = Math.round(y);
  for (const pass of [0, 1]) {
    const col = pass ? c : '#000', o = pass ? 0 : sc;
    for (let i = 0; i < s.length; i++) if (s[i] !== ' ') ctx.drawImage(glyph(s[i], col), x + i * 6 * sc + o, y - 3 * sc + o, 5 * sc, 11 * sc);
  }
}
function wrap(text, maxW) {
  const words = text.split(' '), out = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (t.length * 6 > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur); return out;
}

/* ---------- Iluminação, névoa, partículas ---------- */
const LIGHTS = [], view = { x: 0, y: 0 };
function light(wx, wy, r, c, a, s) { const x = wx - view.x, y = wy + view.y; if (x + r < 0 || x - r > W) return; LIGHTS.push({ x, y, r, c, a, s }); }
function lightS(x, y, r, c, a, s) { if (x + r < 0 || x - r > W) return; LIGHTS.push({ x, y, r, c, a, s }); }
function shaft(x, y, len, w, col, a, ang) {
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(x, y); ctx.rotate(ang);
  const g = ctx.createLinearGradient(0, 0, len, 0); g.addColorStop(0, 'rgba(' + col + ',' + a + ')'); g.addColorStop(1, 'rgba(' + col + ',0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, -w * .15); ctx.lineTo(len, -w); ctx.lineTo(len, w); ctx.lineTo(0, w * .15); ctx.fill(); ctx.restore();
}
const parts = [];
function puff(x, y, n, vx = 0) { for (let i = 0; i < n; i++) parts.push({ x: x + (Math.random() - .5) * 6, y, vx: (Math.random() - .5) * 46 + vx, vy: -Math.random() * 34, life: .3 + Math.random() * .25, t: 0, col: '#c4bcd4', g: 70 }); }
function drawParts() { for (const p of parts) { ctx.globalAlpha = Math.max(0, 1 - p.t / p.life) * .8; R(p.x, p.y, p.g < 100 ? 1 : .5, p.g < 100 ? 1 : .5, p.col); } ctx.globalAlpha = 1; }
const fogTex = mkCanvas(512, 48);
(function () {
  const g = fogTex.getContext('2d');
  for (let i = 0; i < 30; i++) {
    const x = Math.random() * 512, y = 12 + Math.random() * 24, r = 18 + Math.random() * 30;
    for (const ox of [-512, 0, 512]) { const gr = g.createRadialGradient(x + ox, y, 0, x + ox, y, r); gr.addColorStop(0, 'rgba(255,255,255,.3)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(x + ox - r, y - r, 2 * r, 2 * r); }
  }
})();
const fogCache = {};
function tintFog(color) {
  if (fogCache[color]) return fogCache[color];
  const c = mkCanvas(512, 48), g = c.getContext('2d'); g.drawImage(fogTex, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, 512, 48);
  return (fogCache[color] = c);
}
function drawFog(y, par, speed, color, a) {
  const tx = tintFog(color), off = Math.round(-((((cam * par + time * speed) % 512) + 512) % 512));
  ctx.globalAlpha = a; ctx.drawImage(tx, off, y); ctx.drawImage(tx, off + 512, y); ctx.globalAlpha = 1;
}
const rain = Array.from({ length: 150 }, () => ({ x: Math.random() * W, y: Math.random() * H, z: .4 + Math.random() * .6 }));
const motes = Array.from({ length: 28 }, () => ({ x: Math.random() * W, y: 40 + Math.random() * 150, ph: Math.random() * 6.28 }));
function updateFX(dt) {
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; if (p.t > p.life) parts.splice(i, 1); }
  if (mode === 'play' && scene && scene.rain && scene.kind === 'plat' && Math.random() < .7) parts.push({ x: cam + Math.random() * W, y: GROUND - 1, vx: (Math.random() - .5) * 10, vy: -28 - Math.random() * 20, life: .22, t: 0, col: '#9fb4ff', g: 260 });
  if ((mode !== 'play') || (scene && scene.rain)) for (const r of rain) { r.y += r.z * 340 * dt; r.x -= r.z * 70 * dt; if (r.y > H) { r.y = -8; r.x = Math.random() * (W + 60); } if (r.x < -4) r.x += W + 8; }
  for (const m of motes) { m.x += Math.sin(time * .6 + m.ph) * 9 * dt; m.y += Math.cos(time * .5 + m.ph * 1.7) * 6 * dt; if (m.x < 0) m.x += W; if (m.x > W) m.x -= W; if (m.y < 20) m.y = 190; if (m.y > 195) m.y = 25; }
}
function drawRain(n, col = 'rgba(190,205,255,.75)') {
  ctx.fillStyle = col;
  for (let i = 0; i < n; i++) { const r = rain[i], seg = 2 + Math.round(r.z * 4); for (let s = 0; s < seg; s++) ctx.fillRect(Math.round(r.x * SC) / SC - s * .5, Math.round(r.y * SC) / SC + s, .5, 1); }
}
function drawMotes(kind) {
  for (const m of motes) {
    if (kind === 'fly') { const b = .5 + .5 * Math.sin(time * 2 + m.ph * 3); if (b < .25) continue; ctx.globalAlpha = b; R(m.x, m.y, 2, 2, '#e4ffa0'); ctx.globalAlpha = 1; lightS(m.x, m.y, 18, [200, 255, 110], .5 * b); }
    else { ctx.globalAlpha = .55; R(m.x, m.y, 1, 1, '#fff4d0'); ctx.globalAlpha = 1; }
  }
}

/* ---------- Pós-processamento ---------- */
const lm = mkCanvas(192, 108), lmx = lm.getContext('2d'), glc = mkCanvas(192, 108), glx = glc.getContext('2d');
const bl = mkCanvas(96, 54), blx = bl.getContext('2d');
const noise = mkCanvas(512, 288);
(function () { const g = noise.getContext('2d'), id = g.createImageData(512, 288); for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); })();
const TITLE_FX = { bloom: .5, vig: .5, grain: .08 };
function radial(g2, L, a) {
  const x = L.x / 2, y = L.y / 2, r = L.r / 2, gr = g2.createRadialGradient(x, y, 0, x, y, r), col = L.c.join(',');
  gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(.45, `rgba(${col},${a * .45})`); gr.addColorStop(1, `rgba(${col},0)`);
  g2.fillStyle = gr; g2.fillRect(x - r, y - r, 2 * r, 2 * r);
}
function compose() {
  const m = mcx; m.setTransform(1, 0, 0, 1, 0, 0); m.clearRect(0, 0, W * SC, H * SC);
  m.filter = 'blur(1px)'; m.drawImage(bgc, shk.x * SC, shk.y * SC); m.filter = 'none';
  m.drawImage(gc, shk.x * SC, shk.y * SC);
  m.filter = 'blur(2px)'; m.drawImage(fgc, shk.x * SC, shk.y * SC); m.filter = 'none';
}
function post() {
  const d = dctx, fx = (mode === 'play' && scene) ? scene.fx : TITLE_FX;
  compose();
  d.setTransform(1, 0, 0, 1, 0, 0); d.globalCompositeOperation = 'source-over'; d.globalAlpha = 1;
  const kk = DW / (W * SC); d.imageSmoothingEnabled = Math.abs(kk - Math.round(kk)) > .02; d.drawImage(mc, 0, 0, DW, DH);
  d.imageSmoothingEnabled = true;
  if (fx.bloom) {
    blx.clearRect(0, 0, 96, 54); blx.filter = 'brightness(.8) contrast(1.8) blur(1.5px)'; blx.drawImage(mc, 0, 0, 96, 54); blx.filter = 'none';
    d.globalCompositeOperation = 'lighter'; d.globalAlpha = fx.bloom; d.drawImage(bl, 0, 0, DW, DH);
  }
  if (fx.ambient) {
    lmx.globalCompositeOperation = 'source-over'; lmx.fillStyle = fx.ambient; lmx.fillRect(0, 0, 192, 108);
    glx.clearRect(0, 0, 192, 108); lmx.globalCompositeOperation = 'lighter'; glx.globalCompositeOperation = 'lighter';
    for (const L of LIGHTS) {
      radial(lmx, L, L.a); radial(glx, L, L.a * .8);
      if (L.s) { glx.save(); glx.translate(L.x / 2, L.y / 2); glx.scale(4, .12); const r = L.r * .3, gr = glx.createRadialGradient(0, 0, 0, 0, 0, r); gr.addColorStop(0, 'rgba(' + L.c.join(',') + ',' + L.s + ')'); gr.addColorStop(1, 'rgba(' + L.c.join(',') + ',0)'); glx.fillStyle = gr; glx.fillRect(-r, -r, 2 * r, 2 * r); glx.restore(); }
    }
    d.globalCompositeOperation = 'multiply'; d.globalAlpha = 1; d.drawImage(lm, 0, 0, DW, DH);
    d.globalCompositeOperation = 'lighter'; d.globalAlpha = .5; d.drawImage(glc, 0, 0, DW, DH);
  }
  if (fx.grade) { d.globalCompositeOperation = 'overlay'; d.globalAlpha = fx.grade[1]; d.fillStyle = fx.grade[0]; d.fillRect(0, 0, DW, DH); }
  d.globalCompositeOperation = 'source-over'; d.globalAlpha = 1;
  const vg = d.createRadialGradient(DW / 2, DH / 2, DH * .3, DW / 2, DH / 2, DW * .62);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${fx.vig || .5})`); d.fillStyle = vg; d.fillRect(0, 0, DW, DH);
  if (fx.grain) { d.globalCompositeOperation = 'overlay'; d.globalAlpha = fx.grain; d.drawImage(noise, Math.random() * 128 | 0, Math.random() * 72 | 0, 384, 216, 0, 0, DW, DH); }
  d.globalCompositeOperation = 'source-over'; d.globalAlpha = 1;
}

/* ---------- Personagens em alta densidade: sprites desenhados em pixels do dispositivo (SC = 2) ---------- */
const JOAO = { cap: '#c0392b', capL: '#e8604c', skin: '#e0a070', skinD: '#b87a4c', jacket: '#f1c40f', jacketD: '#b8860b', jacketL: '#ffe27a', stripe: '#dfe6ea', pants: '#2b3a8a', pantsD: '#1c2760', shoe: '#15151c', bag: '#d35400', bagL: '#f39c12', bagD: '#8a3a05', hair: '#2a1a12' };
const CHEF = { cap: '#f4f4f4', capL: '#fff', skin: '#e0a070', skinD: '#b87a4c', jacket: '#ecf0f1', jacketD: '#aab4ba', jacketL: '#fff', stripe: '#c0392b', pants: '#4a4a52', pantsD: '#34343a', shoe: '#15151c', hat: 1, hair: '#8a8a8a' };
const ATEN = { cap: '#1e8449', capL: '#27ae60', skin: '#c98858', skinD: '#9a6238', jacket: '#2ecc71', jacketD: '#1e8449', jacketL: '#7ef0a8', stripe: '#fff', pants: '#3a3a44', pantsD: '#26262e', shoe: '#15151c', hair: '#2a1a12' };
const FGW = 48, FGH = 72, FOX = 4, FOY = 14;   // sprite do personagem em pixels do dispositivo; pés em y = 40 (+FOY)

  if (!blinkP) person(P.x, P.y, P.face, P.st, P.anim, JOAO);
  if (scene.reflect && P.ground && !blinkP) { ctx.save(); ctx.beginPath(); ctx.rect(P.x - 12, P.y + P.h, 32, 18); ctx.clip(); ctx.globalAlpha = .22; ctx.translate(0, 2 * (P.y + P.h)); ctx.scale(1, -1); person(P.x, P.y, P.face, P.st, P.anim, JOAO); ctx.restore(); }
  ctx.restore();
  ctx = fgx; if (scene.front) scene.front(cam); if (scene.rain) drawRain(110); ctx = gctx;
}
function hudPlat() {
  txt('MOCHILA  ◆ x' + S.coins, 6, 5, '#ffe45e'); txt(scene.label, W - 6, 5, '#fff', 'right');
  if (S.tique) { txt('NÚCLEOS ' + (S.core1 + S.core2) + '/2', 6, 15, '#7fe9ff'); if (S.dj) txt('SALTO ECO', 6, 25, '#7fe9ff'); }
  if (scene.near && !dlg) { const px = scene.near.x + scene.near.w / 2 - view.x, py = scene.near.y + OY - 14; R(px - 6, py - 2, 12, 12, '#fff'); R(px - 5, py - 1, 10, 10, '#222'); txt('E', px, py, '#ffe45e', 'center'); }
  if (scene.timed) {
    const t = Math.max(0, scene.t), col = t < 8 ? '#ff4a4a' : '#7fe9ff', bw = 150, bx = (W - bw) / 2;
    R(bx - 2, 14, bw + 4, 10, '#000'); R(bx, 16, bw * t / scene.timed, 6, col);
    txt('JANELA TEMPORAL ' + t.toFixed(1) + 's', W / 2, 26, col, 'center');
  }
  if (scene.name === 'mata' && scene.age < 12 && !dlg) txt('←→ mover · SHIFT correr · ESPAÇO pular · E interagir', W / 2, H - 14, '#fff', 'center');
}

/* ---------- Título e fim ---------- */
function drawTitle() {
  sky('#0b0620', '#2a1559', '#a84a7a');
  for (let i = 0; i < 40; i++) R(hs(i, 1) % W, hs(i, 2) % 150, 1, 1, Math.floor(time * 2 + i) % 4 ? '#fff' : '#667');
  city(time * 6, .5, 190, '#190f38', '#e8b45a', 5);
  const cs = ['#e74c3c', '#f1c40f', '#3498db', '#2ecc71', '#9b59b6', '#e67e22'], ns = ['04', '17', '23', '38', '41', '56'];
  for (let i = 0; i < 6; i++) { const x = 30 + i * 58, y = 150 + Math.sin(time * 1.5 + i) * 6; R(x, y, 18, 18, cs[i]); R(x + 2, y - 2, 14, 22, cs[i]); R(x - 2, y + 2, 22, 14, cs[i]); txt(ns[i], x + 9, y + 5, '#fff', 'center'); }
  txt('SORTE', W / 2, 38, '#ffe45e', 'center', 40);
  txt('Uma questão de tempo', W / 2, 88, '#fff', 'center', 12);
  txt('DEMO JOGÁVEL', W / 2, 108, '#7fe9ff', 'center', 8);
  if (Math.floor(time * 2) % 2) txt('Pressione ENTER ou ESPAÇO', W / 2, 126, '#fff', 'center');
  txt('← → mover · SHIFT correr · ESPAÇO pular · ↓ abaixar', W / 2, H - 24, '#aab', 'center');
  txt('E interagir · M som', W / 2, H - 13, '#aab', 'center');
  drawRain(120);
}
function endDemo() { mode = 'end'; musicTheme = 'title'; }
function drawEnd() {
  sky('#0b0620', '#2a1559', '#7a3a9a');
  city(time * 4, .5, 200, '#190f38', '#e8b45a', 9);
  txt('FIM DA DEMO', W / 2, 24, '#ffe45e', 'center', 22);
  txt('Os números mudaram. A linha do tempo também.', W / 2, 62, '#fff', 'center');
  const ls = ['Moedas na mochila: ' + S.coins, 'Loops no acidente: ' + S.loops, 'Tentativas na lotérica: ' + S.tries, 'Núcleos de memória: ' + (S.core1 + S.core2) + '/2', '', 'Em breve: mais memórias do Tique,', 'ecos temporais, a política e os outros cenários.'];
  ls.forEach((l, i) => txt(l, W / 2, 86 + i * 12, i > 4 ? '#9fb3ff' : '#fff', 'center'));
  if (Math.floor(time * 2) % 2) txt('ENTER para jogar de novo', W / 2, H - 22, '#fff', 'center');
}

/* ---------- Laço principal ---------- */
function startGame() {
  S.coins = 0; S.loops = 0; S.sawTV = false; S.bet = false; S.tries = 0; S.tique = false; S.core1 = 0; S.core2 = 0; S.dj = false; S.extra = 0;
  scene = makeMata(); resetPlayer(); mode = 'play';
  say([['Narrador', 'Uma ladeira, uma moto fora da pista... e uma luz estranha no meio da mata.'], ['João', 'Ai... minha cabeça. Estou inteiro, mas a moto... De onde vem aquela luz?']]);
}
function step(dt) {
  time += dt; shake = Math.max(0, shake - dt * 30); flash = Math.max(0, flash - dt); updateFX(dt);
  if (pressed.mute) muted = !muted;
  if (mode === 'title') { musicTheme = 'title'; if (pressed.act || pressed.jump) startGame(); return; }
  if (mode === 'end') { if (pressed.act || pressed.jump || pressed.reset) { mode = 'title'; scene = null; } return; }
  if (warp) { warp.t += dt; if (warp.t > .7 && !warp.did) { warp.did = true; warp.fn(); } if (warp.t > 1.4) warp = null; return; }
  if (dlg) { updateDlg(dt); return; }
  if (scene.kind === 'moto') updateMoto(dt); else updatePlat(dt);
}
function render() {
  for (const c of [gctx, bgx, fgx, uctx]) c.setTransform(SC, 0, 0, SC, 0, 0);
  LIGHTS.length = 0; bgx.clearRect(0, 0, W, H); fgx.clearRect(0, 0, W, H);
  shk.x = shake > 0 ? Math.round((Math.random() - .5) * shake) : 0; shk.y = shake > 0 ? Math.round((Math.random() - .5) * shake) : 0;
  ctx = gctx; ctx.clearRect(0, 0, W, H);
  if (mode === 'title') { R(0, 0, W, H, '#000'); drawTitle(); } else if (mode === 'end') { R(0, 0, W, H, '#000'); drawEnd(); }
  else if (scene) { if (scene.kind === 'moto') drawMoto(); else drawPlatWorld(); }
  ctx = gctx;
  post();
  ctx = uctx; uctx.clearRect(0, 0, W, H);
  if (mode === 'play' && scene) { if (scene.kind === 'moto') hudMoto(); else hudPlat(); }
  if (flash > 0) { ctx.globalAlpha = Math.min(1, flash); R(0, 0, W, H, '#fff'); ctx.globalAlpha = 1; }
  drawDlg(); drawWarp();
  if (muted) txt('(mudo)', W - 6, H - 12, '#aaa', 'right');
  dctx.globalCompositeOperation = 'source-over'; dctx.globalAlpha = 1; dctx.imageSmoothingEnabled = false; dctx.drawImage(uc, 0, 0, DW, DH);
  ctx = gctx;
}
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(.1, (now - last) / 1000); last = now;
  while (acc >= 1 / 60) { step(1 / 60); acc -= 1 / 60; for (const k in pressed) pressed[k] = false; }
  render(); requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
cv.focus();
window.__sorte = { S, get scene() { return scene; }, get P() { return P; }, startGame, step, get mode() { return mode; } };
</script>
